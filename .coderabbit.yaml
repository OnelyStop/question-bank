# CodeRabbit config. Free on public repos.
# The value here is the path_instructions: every rule below came from a
# measurement in this repo, and none of them are inferable from the code.
language: en-GB

tone_instructions: >-
  Be direct and brief. Point at the line, say what breaks, say what to do
  instead. If the change is fine, say so in one sentence rather than inventing
  findings.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  path_filters:
    - "!corpus/pdf/**"        # 375 source PDFs, 414 MB — nothing to review
    - "!data/**"              # generated export
    - "!**/*.jsonl"

  path_instructions:
    - path: "pipeline/**"
      instructions: >-
        This pipeline turns exam PDFs into one flat questions export. Read the
        README of any step the PR touches — each states what that step must
        produce and how to tell it worked.

        Flag these, they are the failures that have actually happened here:

        1. SILENT FAILURE. A script that finds no input and reports success
        instead of erroring. This repo has hit it twice: a path resolving to a
        deleted directory returned "papers=0" and exited 0. Any code that can
        produce an empty result without erroring must say so loudly.

        2. FUZZY MATCHING IN DEDUPE. Dedupe is sha256 over the normalised stem
        plus sorted options, with digits NEVER normalised. Reject any
        similarity threshold, edit distance, embedding comparison or
        digit-stripping introduced into it. Two measurements: 105 of 287
        look-alike question pairs differ only in their numbers and have
        different answers; and a "same first 3000 characters" heuristic flagged
        47 PDF pairs of which 46 were false positives. For quantitative
        questions the numbers ARE the question.

        3. WRONG ANSWERS. A wrong answer is worse than no answer. Every answer
        must be a key that exists in that question's own options — "e" on a
        four-option question is a parse error, not an answer. Never carry an
        answer between questions whose numeric tuples differ. Answer keys join
        by (paper_id, q_num), so flag anything that joins on text instead.

        4. LOST PROVENANCE. Step 3 must write dedupe_report.json mapping each
        surviving content_hash to every (paper_id, q_num) it absorbed. Step 4
        needs it to look up an answer in any paper the question appeared in.
        Dropping it silently costs answer coverage.

        5. OFF-BY-ONE IN THE ANSWER JOIN. 100 questions and 100 answers shifted
        by one look perfect in aggregate and are entirely wrong. Require
        matched-and-unmatched counts on both sides, not just a success count.

    - path: "schema/**"
      instructions: >-
        schema/schema.json is the contract with the app. A new optional field is
        safe; renaming or removing one is not — say what the app must change.
        Every field in a step's output.json must exist here with the right type,
        and each step's output must stay a SUPERSET of the previous step's. A
        step that drops a field breaks everything downstream of it.

    - path: ".github/**"
      instructions: >-
        Check that a CI step can actually fail. A grep that matches its own
        pattern in the workflow file, or a check that passes by finding nothing,
        is worse than no check — this repo shipped both. Verify new checks
        exclude .github/workflows/ where the pattern would self-match.

    - path: "corpus/**"
      instructions: >-
        corpus/ is INPUT and is never modified in place. Some of it is the only
        copy of an extraction — the source PDFs were absent for a long stretch
        and the JSON was irreplaceable. Flag hard: any deletion, any in-place
        edit, and any .gitignore rule broad enough to untrack tracked files. A
        rule of "corpus/*" once nearly untracked 93 MB, and "*.pdf" once matched
        20 tracked files. Scope ignore rules to an exact path.

  tools:
    ruff:
      enabled: true
    markdownlint:
      enabled: false        # prose here is deliberately hand-wrapped
    actionlint:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true
